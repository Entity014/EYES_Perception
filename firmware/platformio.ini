; XIAO ESP32-S3 Sense — camera stream + SD record + OTA
[platformio]
default_envs = xiao

[env]
build_flags =
    -std=gnu++17
    -I config

; --- xiao: normal build, UART/USB upload (use this for now) ---
[env:xiao]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    espressif/esp32-camera
upload_protocol = esptool
; upload_port auto-detected over USB serial

; --- xiao-ota: same firmware, upload over the device AP ---
; export OTA_PASSWORD in your shell to match config.h, then:
;   pio run -e xiao-ota -t upload
[env:xiao-ota]
extends = env:xiao
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=${sysenv.OTA_PASSWORD}

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
