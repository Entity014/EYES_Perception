; XIAO ESP32-S3 Sense — camera stream + SD record + OTA
[platformio]
default_envs = xiao

[env]
build_flags =
    -std=gnu++17
    -I config

; --- xiao: normal build, UART/USB upload (use this for now) ---
[env:xiao]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    ; 0, not higher: ESP32 core debug logging writes to the same Serial/USB-CDC
    ; port that carries the binary MJPEG frame + command protocol (usbstream),
    ; unsynchronized with usbstream's own write lock -- any log line printed
    ; mid-frame splices into the JPEG bytes and corrupts it on the receiving
    ; end (seen as "Corrupt JPEG data: N extraneous bytes" in usb_gui.py).
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    espressif/esp32-camera
upload_protocol = esptool
; upload_port auto-detected over USB serial

; --- xiao-ota: same firmware, upload over WiFi ---
; export OTA_PASSWORD to match config.h, then:
;   pio run -e xiao-ota -t upload --upload-port xiao-cam.local
; (AP fallback address is 192.168.4.1; on your LAN use xiao-cam.local
;  or the IP printed on serial)
[env:xiao-ota]
extends = env:xiao
upload_protocol = espota
upload_port = xiao-cam.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
